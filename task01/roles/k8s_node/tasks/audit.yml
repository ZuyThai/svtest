---
- name: Ensure command audit log directory exists
  ansible.builtin.file:
    path: "{{ audit_command_log_dir }}"
    state: directory
    owner: root
    group: adm
    mode: "0750"

- name: Configure auditd log destination and rotation
  ansible.builtin.template:
    src: auditd.conf.j2
    dest: /etc/audit/auditd.conf
    owner: root
    group: root
    mode: "0640"
  notify: Restart auditd

- name: Configure exec audit rules
  ansible.builtin.template:
    src: audit-user-commands.rules.j2
    dest: /etc/audit/rules.d/90-k8s-user-commands.rules
    owner: root
    group: root
    mode: "0640"
  notify:
    - Restart auditd
    - Load audit rules

- name: Ensure auditd service is enabled and running
  ansible.builtin.service:
    name: auditd
    enabled: true
    state: started
