---
- name: Load Kubernetes kernel modules immediately
  ansible.builtin.command: "modprobe {{ item }}"
  loop: "{{ k8s_kernel_modules }}"
  changed_when: false

- name: Persist Kubernetes kernel modules
  ansible.builtin.template:
    src: k8s-modules-load.conf.j2
    dest: /etc/modules-load.d/k8s.conf
    owner: root
    group: root
    mode: "0644"

- name: Persist Kubernetes sysctl settings
  ansible.builtin.template:
    src: k8s-sysctl.conf.j2
    dest: "{{ k8s_sysctl_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: Apply sysctl

- name: Apply sysctl settings now
  ansible.builtin.command: sysctl --system
  changed_when: false

- name: Disable active swap
  ansible.builtin.command: swapoff -a
  when: ansible_facts.swaptotal_mb | int > 0
  changed_when: true

- name: Disable swap entries in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(\s*[^#]\S+\s+\S+\s+swap\s+.*)$'
    replace: '# Kubernetes node provisioning disabled swap: \1'
    backup: true

- name: Collect active systemd swap units
  ansible.builtin.command: systemctl list-units --type=swap --all --no-legend --no-pager
  register: active_swap_units
  changed_when: false
  failed_when: false

- name: Stop and mask systemd swap units
  ansible.builtin.systemd_service:
    name: "{{ item.split()[0] }}"
    state: stopped
    masked: true
  loop: "{{ active_swap_units.stdout_lines }}"
  when:
    - active_swap_units.stdout | length > 0
    - item.split() | length > 0
