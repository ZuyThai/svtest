---
k8s_node_manage_hostname: true
k8s_node_hostname: "{{ inventory_hostname }}"
k8s_node_manage_dns: true
k8s_node_primary_ip: "{{ ansible_default_ipv4.address | default('') }}"
k8s_node_dns_servers:
  - "1.1.1.1"
  - "8.8.8.8"
k8s_node_fallback_dns_servers:
  - "9.9.9.9"
  - "8.8.4.4"
k8s_node_dns_search_domains: []
k8s_node_cri_socket: "unix:///run/containerd/containerd.sock"

k8s_node_base_packages:
  - apt-transport-https
  - auditd
  - audispd-plugins
  - bash-completion
  - ca-certificates
  - chrony
  - conntrack
  - curl
  - dnsutils
  - ebtables
  - ethtool
  - git
  - gnupg
  - htop
  - iftop
  - iotop
  - iproute2
  - ipset
  - iptables
  - ipvsadm
  - jq
  - kmod
  - lsof
  - net-tools
  - nmap
  - procps
  - python3-apt
  - rsync
  - socat
  - tcpdump
  - tmux
  - traceroute
  - unattended-upgrades
  - vim

sysadmin_users:
  - name: opsadmin
    comment: "Operations administrator"
    groups:
      - sudo
    shell: /bin/bash
    ssh_keys: []
sysadmin_password_store_dir: "{{ playbook_dir }}/generated_passwords/{{ inventory_hostname }}"
sysadmin_generated_password_length: 24
sysadmin_force_password_change: true
sysadmin_sudo_nopasswd: false

k8s_kernel_modules:
  - overlay
  - br_netfilter
k8s_sysctl_file: /etc/sysctl.d/99-kubernetes-cri.conf
k8s_sysctl_settings:
  net.bridge.bridge-nf-call-iptables: "1"
  net.bridge.bridge-nf-call-ip6tables: "1"
  net.ipv4.ip_forward: "1"

containerd_package_name: containerd
containerd_service_name: containerd
containerd_config_path: /etc/containerd/config.toml
containerd_root_dir: /var/lib/containerd
containerd_state_dir: /run/containerd
containerd_pause_image: "registry.k8s.io/pause:3.10"
containerd_snapshotter: overlayfs
containerd_default_runtime: runc
containerd_max_container_log_line_size: 16384
containerd_discard_unpacked_layers: true
containerd_grpc_max_recv_message_size: 16777216
containerd_grpc_max_send_message_size: 16777216
containerd_oom_score: -999

kubernetes_minor_version: "1.36"
kubernetes_package_version: ""
kubernetes_apt_repo_url: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_minor_version }}/deb/"
kubernetes_apt_key_url: "{{ kubernetes_apt_repo_url }}Release.key"
kubernetes_packages:
  - kubelet
  - kubeadm
  - kubectl

audit_command_log_dir: /var/log/k8s-user-commands
audit_command_log_file: "{{ audit_command_log_dir }}/audit.log"
audit_max_log_file_mb: 100
audit_num_logs: 20

k8s_node_run_validation: true
