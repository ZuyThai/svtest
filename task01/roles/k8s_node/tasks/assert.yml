---
- name: Assert Ubuntu 24.04 LTS target
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Ubuntu"
      - ansible_facts.distribution_release == "noble"
      - ansible_facts.distribution_version is version("24.04", ">=")
      - ansible_facts.distribution_version is version("24.05", "<")
    fail_msg: "This role is intentionally limited to Ubuntu 24.04 LTS (noble)."

- name: Assert supported CPU architecture
  ansible.builtin.assert:
    that:
      - ansible_facts.architecture in ["x86_64", "aarch64", "arm64"]
    fail_msg: "Supported architectures are x86_64/amd64 and arm64/aarch64."

